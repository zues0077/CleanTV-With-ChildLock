plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// TV 端「直接覆盖安装 / 不卸载更新」依赖三件事，改动发布配置时请勿破坏：
//   1) applicationId 保持不变：com.cleantv.launcher
//   2) 每个版本都使用同一张签名证书：signing/cleantv-release.jks
//   3) 每次发版 versionCode 必须 +1（否则 adb install -r 会因降级被拒绝）
// 密钥文件不进 Git（见 .gitignore），请自行备份；一旦丢失只能卸载重装。
// 若仓库里没有该密钥（例如他人 clone 后构建），自动回退到本机 debug 签名。
// ---------------------------------------------------------------------------
def releaseKeystore = rootProject.file('signing/cleantv-release.jks')
def useStableSigning = releaseKeystore.exists()

android {
    namespace 'com.cleantv.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cleantv.launcher'
        minSdk 21
        targetSdk 34
        // 每次发布新版本必须递增，例如 2 / 3 ...，配合 adb install -r 覆盖安装
        versionCode 2
        versionName '1.0.1'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        if (useStableSigning) {
            stable {
                storeFile releaseKeystore
                storePassword 'cleantv-release-2026'
                keyAlias 'cleantv'
                keyPassword 'cleantv-release-2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig useStableSigning ? signingConfigs.stable : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // debug 包同样使用固定证书，避免开发包与正式包在电视上签名冲突
            signingConfig useStableSigning ? signingConfigs.stable : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
}
